<div class="categotry_container">
  <div class="header-section">
    <div>
      <h2>Manage Categories</h2>
      <p>Manage your category catalog, pricing, and stock levels.</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary"><span class="icon">⬇️</span> Export</button>
      <button class="btn btn-primary"  (click)="openform()"><span class="icon">➕</span> Add Category</button>
    </div>
  </div>

  @if (showform) {
    <div class="category-form">
      <div class="form-header">
        <h3>Add Category</h3>
        <button (click)="closeform()"><span class="icon">✖</span></button>
      </div>
      <form>
        <div class="form-group">
          <label>Category Name</label>
          <input type="text" placeholder="Category Name" class="form-control" [(ngModel)]="newCategory.name" name="name">
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" placeholder="Description" class="form-control" [(ngModel)]="newCategory.description" name="description">
        </div>
        <div class="form-group">
          <label>Active Status</label>
          <select class="form-control" [(ngModel)]="newCategory.active_status" name="active_status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary" (click)="addCategory()">Add Category</button>
        </div>
      </form>
    </div>
  }

  <div class="category-card">
    <div class="card-header">
      <h3>All Categories</h3>
      <input type="text" placeholder="Search categories..." class="search-input" (keyup.enter)="searchCategory($event)"/>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Category Name</th>
            <th>Description</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let category of categories">
            <td>{{category.name}}</td>
            <td>{{category.description}}</td>
            <td>{{category.isActive ? 'Active' : 'Inactive'}}</td>
            <td>
              <button class="edit-btn">Edit</button>
              <button class="delete-btn">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
